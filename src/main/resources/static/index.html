<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путешествие по истории Казахстана</title>
  <meta name="description" content="Образовательная игра: десять глав истории Казахстана, диалоги и задания.">
  <link rel="icon" href="/assets/compass.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="#" id="brand" class="brand"><img src="/assets/compass.svg" width="40" height="40" alt=""><span>Путешествие<span class="brand-sub">ПО ИСТОРИИ КАЗАХСТАНА</span></span></a>
